[project]
name = "spotify-mcp"
version = "0.1.0"
description = "Personal MCP server for Spotify playlist management and listening analytics"
authors = [
    { name = "Stipe15", email = "stipe.cubelic2005s@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.1.1",
    "httpx2>=2.12",
    "pydantic>=2.12",
    "platformdirs>=4",
    "python-dotenv>=1",
]

[project.scripts]
spotify-mcp = "spotify_mcp.__main__:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
